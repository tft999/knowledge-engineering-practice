[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cookkg"
version = "0.1.0"
description = "HowToCook ingredient graph and constrained menu planning"
requires-python = ">=3.13"
dependencies = ["networkx>=3.4,<4", "pydantic>=2.10,<3", "typer>=0.15,<1", "neo4j>=5.26,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
cookkg = "cookkg.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cookkg = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Neo4j database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
