[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cookkg"
version = "0.1.0"
description = "HowToCook ingredient graph and constrained menu planning"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "networkx>=3.4,<4",
    "neo4j>=5.26,<7",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.12,<3", "pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
cookkg = "cookkg.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cookkg = ["resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live Neo4j database"]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
